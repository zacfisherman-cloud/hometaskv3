<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Home Tasks</title>
<meta name="theme-color" id="meta-theme" content="#10131C">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js" defer></script>
<script>
  // Offline shell (sw.js). Registration failure (e.g. dev harness) is fine.
  if('serviceWorker' in navigator)
    addEventListener('load', ()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</head>
<body>
<div id="root">

  <!-- ── Setup ─────────────────────────────────── -->
  <div id="setup">
    <div class="setup-top">
      <div class="logo-mark">
        <i data-lucide="house-plus"></i>
        <span class="spark"><i data-lucide="sparkles"></i></span>
      </div>
      <div><div class="wordmark">Home <span>Tasks</span></div></div>
      <p class="setup-tag">Weekly chores,&nbsp;together.</p>
    </div>
    <div class="setup-form" id="setup-create">
      <div>
        <p class="field-label">Your name</p>
        <div class="field"><i data-lucide="user" class="ic"></i>
          <input id="inp-name1" type="text" placeholder="Your name" autocomplete="given-name"></div>
      </div>
      <div>
        <p class="field-label">Partner's name</p>
        <div class="field"><i data-lucide="users" class="ic"></i>
          <input id="inp-name2" type="text" placeholder="Partner's name" autocomplete="off"></div>
      </div>
      <div>
        <p class="field-label">Your email <span class="opt-lbl">(optional)</span></p>
        <div class="field"><i data-lucide="mail" class="ic"></i>
          <input id="inp-email1" type="email" placeholder="your@email.com" autocomplete="email"></div>
      </div>
      <div>
        <p class="field-label">Partner's email <span class="opt-lbl">(optional)</span></p>
        <div class="field"><i data-lucide="mail" class="ic"></i>
          <input id="inp-email2" type="email" placeholder="partner@email.com" autocomplete="off"></div>
      </div>
      <p class="setup-opt-note">Optional — used for Calendar invite links &amp; reminders</p>
      <button class="btn-primary" id="setup-go">Get Started <i data-lucide="arrow-right"></i></button>
      <p class="setup-foot">Tip: tap <b>Share → Add to Home Screen</b> for the best experience</p>
    </div>
    <div class="setup-form hidden" id="setup-rolepick"></div>
  </div>

  <!-- ── App ───────────────────────────────────── -->
  <div id="app" hidden>
    <div id="hdr"></div>
    <div id="panel"></div>
    <nav id="bnav">
      <button class="ni active" data-tab="tasks">
        <span class="ni-ic"><i data-lucide="list-checks"></i></span><span class="ni-lb">Tasks</span>
      </button>
      <button class="ni" data-tab="dates">
        <span class="ni-ic"><i data-lucide="heart"></i></span><span class="ni-lb">Dates</span>
      </button>
      <button class="ni" data-tab="meals">
        <span class="ni-ic"><i data-lucide="chef-hat"></i></span><span class="ni-lb">Meals</span>
      </button>
      <button class="ni" data-tab="history">
        <span class="ni-ic"><i data-lucide="bar-chart-2"></i></span><span class="ni-lb">Stats</span>
      </button>
      <button class="ni" data-tab="settings">
        <span class="ni-ic"><i data-lucide="settings"></i></span><span class="ni-lb">Settings</span>
      </button>
    </nav>
  </div>

  <!-- ── Sheet overlay ─────────────────────────── -->
  <div id="overlay" class="hidden">
    <div id="dim"></div>
    <div id="sheet"></div>
  </div>

  <!-- ── Modal overlay ─────────────────────────── -->
  <div id="modal-layer" class="hidden">
    <div id="mdim"></div>
    <div id="mbox"></div>
  </div>
</div>

<!-- ══ DEBUG READOUT (temporary, diagnostic only — revert after) ══ -->
<div id="dbg-readout"></div>
<script>
(function(){
  var el = document.getElementById('dbg-readout');
  el.style.cssText = 'position:fixed;left:6px;right:6px;'
    + 'bottom:calc(78px + env(safe-area-inset-bottom) + 8px);'
    + 'z-index:99999;background:rgba(0,0,0,.88);color:#0f0;'
    + 'font:11px/1.35 ui-monospace,Menlo,monospace;padding:8px 10px;'
    + 'border-radius:8px;white-space:pre;pointer-events:auto;'
    + '-webkit-user-select:text;user-select:text;';
  // Probe resolves env(safe-area-inset-bottom) to a number we can read.
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:env(safe-area-inset-bottom);';
  document.body.appendChild(probe);
  var probeTop = document.createElement('div');
  probeTop.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:env(safe-area-inset-top);';
  document.body.appendChild(probeTop);
  function n(v){ return Math.round(v*100)/100; }
  function rectBottom(id){
    var e = document.getElementById(id);
    if(!e) return 'n/a';
    var r = e.getBoundingClientRect();
    return n(r.bottom) + ' (h' + n(r.height) + ')';
  }
  function draw(){
    var body = document.body.getBoundingClientRect();
    var bnav = document.getElementById('bnav');
    var bnavPad = bnav ? getComputedStyle(bnav).paddingBottom : 'n/a';
    var bnavBottom = bnav ? bnav.getBoundingClientRect().bottom : null;
    var vv = window.visualViewport;
    var lines = [
      'SAB probe   : ' + n(probe.getBoundingClientRect().height),
      'SAT probe   : ' + n(probeTop.getBoundingClientRect().height),
      'bnav padBot : ' + bnavPad,
      'innerHeight : ' + window.innerHeight,
      'screen.h    : ' + screen.height + '  avail ' + screen.availHeight,
      'visualVP h  : ' + (vv ? n(vv.height) + ' off ' + n(vv.offsetTop) : 'n/a'),
      'body        : ' + n(body.bottom) + ' (h' + n(body.height) + ')',
      '#root  bot  : ' + rectBottom('root'),
      '#app   bot  : ' + rectBottom('app'),
      '#bnav  bot  : ' + rectBottom('bnav'),
      'GAP inner-bnav: ' + (bnavBottom==null ? 'n/a' : n(window.innerHeight - bnavBottom)),
      'GAP screen-bnav: ' + (bnavBottom==null ? 'n/a' : n(screen.height - bnavBottom)),
      'standalone mm : ' + matchMedia('(display-mode: standalone)').matches,
      'nav.standalone: ' + (('standalone' in navigator) ? navigator.standalone : 'undef'),
      'dpr         : ' + window.devicePixelRatio
    ];
    el.textContent = lines.join('\n');
  }
  draw();
  addEventListener('resize', draw);
  addEventListener('orientationchange', function(){ setTimeout(draw, 300); });
  if(window.visualViewport){ visualViewport.addEventListener('resize', draw); }
  setInterval(draw, 1000);
  el.addEventListener('click', function(){ el.style.display='none'; });
})();
</script>
</body>
</html>
